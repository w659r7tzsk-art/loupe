<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Loupe Aris — Try It On, In Real Light</title>

  <link rel="stylesheet" href="styles.css">
  <script src="https://cdn.jsdelivr.net/npm/three@0.162.0/build/three.min.js"></script>
</head>

<body>

  <div id="loader">
    <div class="curtain left"></div>
    <div class="curtain right"></div>
    <div class="loader-text">
      <span class="loader-type" id="loaderType"></span><span class="loader-cursor"></span>
    </div>
  </div>

  <div id="stage"><canvas id="heroCanvas"></canvas></div>

  <nav>
    <div class="brand">Loupe Aris<span>.</span><span class="tag">Concept Preview</span></div>
    <a class="cta-mini" href="#cta">Request a Demo</a>
  </nav>

  <div class="content">
    <div class="progress-nav" id="progressNav">
      <span class="progress-dot"></span><span class="progress-dot"></span><span class="progress-dot"></span><span
        class="progress-dot"></span>
    </div>

    <section class="hero">
      <p class="eyebrow">Concept Preview</p>
      <h1>This is<br>the idea.</h1>
      <p>Yours goes on the counter.</p>
      <div class="hero-actions">
        <a class="btn gold" href="#customize">Try the Viewer</a>
        <a class="btn ghost" href="#cta">Get the Pitch Deck</a>
      </div>
      <div class="scroll-cue"><span class="line"></span> Scroll to turn the stone</div>
    </section>

    <div class="facet-divider"></div>

    <section class="live-demo">
      <p class="eyebrow" style="text-align:center;">An Early Look</p>
      <h2 class="live-demo-title">Not a mockup. <em>A first pass.</em></h2>
      <div class="live-demo-frame">
        <video autoplay muted loop playsinline preload="metadata">
          <source
            src="data:video/mp4;base64,AAAAIGZ0eXBpc29tAAACAGlzb21pc28yYXZjMW1wNDEAABf5dXVpZNj+w9YbDkg8kpdYKId+xIEAAAAAbWFuaWZlc3QAAAAAAAAAAAAAABfManVtYgAAAB5qdW1kYzJwYQARABCAAACqADibcQNjMnBhAAAAF[...]"
        >
        </video>
      </div>
      <p class="live-demo-caption">A compact table-top viewer built for realistic lighting and fit.</p>
    </section>

    <!-- Showcase, customize and other sections omitted here for brevity in preview. The real file continues. -->

  </div>

  <footer>
    <div>© Loupe Aris</div>
    <div><a href="#">Privacy</a></div>
  </footer>

  <!-- Application script. Keep Three.js include in head; include app script here so it runs after DOM is ready. -->
  <script src="script.js" defer></script>
</body>
</html>
